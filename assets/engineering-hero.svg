<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Moustafa Hosny Thabet, Multidisciplinary Technologist">
<defs>
<linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#081320"/><stop offset="1" stop-color="#152d48"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7599ba" stroke-opacity=".13"/></pattern>
