<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 532" width="1000" height="532" role="img"><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace}</style><rect width="1000" height="532" rx="14" fill="#000A18"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.00s" fill="freeze"/><rect x="12" y="12" width="976" height="92" rx="10" fill="none" stroke="#1B3A5E" stroke-width="1.5"/><rect x="12" y="12" width="6" height="92" rx="3" fill="#F85804"/><text x="40" y="46" font-size="21" font-weight="700" fill="#E8EEF5">MumGuard</text><text x="40" y="70" font-size="13" fill="#7C93AE">Embedded health-tech device built with a pharmacy team. I was Technical Lead &amp; Developer.</text><text x="40" y="90" font-size="12" fill="#F85804">C++ · sensors · IoT</text><rect x="764" y="28" width="212" height="28" rx="14" fill="none" stroke="#F85804" stroke-width="1.5"/><text x="870.0" y="47" text-anchor="middle" font-size="12.5" fill="#F85804">1st · Rally Egypt 2025</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.25s" fill="freeze"/><rect x="12" y="116" width="976" height="92" rx="10" fill="none" stroke="#1B3A5E" stroke-width="1.5"/><rect x="12" y="116" width="6" height="92" rx="3" fill="#F85804"/><text x="40" y="150" font-size="21" font-weight="700" fill="#E8EEF5">Autonomous Fire-Fighting Boat</text><text x="40" y="174" font-size="13" fill="#7C93AE">Self-navigating boat that finds and puts out a fire. I led the hardware.</text><text x="40" y="194" font-size="12" fill="#F85804">ESP32/Arduino · actuators</text><rect x="814" y="132" width="162" height="28" rx="14" fill="none" stroke="#F85804" stroke-width="1.5"/><text x="895.0" y="151" text-anchor="middle" font-size="12.5" fill="#F85804">IEEE E-JUST 2025</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.50s" fill="freeze"/><rect x="12" y="220" width="976" height="92" rx="10" fill="none" stroke="#1B3A5E" stroke-width="1.5"/><rect x="12" y="220" width="6" height="92" rx="3" fill="#F85804"/><text x="40" y="254" font-size="21" font-weight="700" fill="#E8EEF5">Afro-Asian ROV</text><text x="40" y="278" font-size="13" fill="#7C93AE">Underwater remotely operated vehicle built for the Afro-Asian competition.</text><text x="40" y="298" font-size="12" fill="#F85804">ROV · thrusters · control</text><rect x="831" y="236" width="145" height="28" rx="14" fill="none" stroke="#F85804" stroke-width="1.5"/><text x="903.5" y="255" text-anchor="middle" font-size="12.5" fill="#F85804">2nd · Sep 2025</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.75s" fill="freeze"/><rect x="12" y="324" width="976" height="92" rx="10" fill="none" stroke="#1B3A5E" stroke-width="1.5"/><rect x="12" y="324" width="6" height="92" rx="3" fill="#F85804"/><text x="40" y="358" font-size="21" font-weight="700" fill="#E8EEF5">Marine-facing Radar</text><text x="40" y="382" font-size="13" fill="#7C93AE">Radar prototype that began my interest in sensing and signal processing.</text><text x="40" y="402" font-size="12" fill="#F85804">radar · embedded</text><rect x="722" y="340" width="254" height="28" rx="14" fill="none" stroke="#F85804" stroke-width="1.5"/><text x="849.0" y="359" text-anchor="middle" font-size="12.5" fill="#F85804">Pharos Science Research Day</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="1.00s" fill="freeze"/><rect x="12" y="428" width="976" height="92" rx="10" fill="none" stroke="#1B3A5E" stroke-width="1.5"/><rect x="12" y="428" width="6" height="92" rx="3" fill="#F85804"/><text x="40" y="462" font-size="21" font-weight="700" fill="#E8EEF5">NovaChip</text><text x="40" y="486" font-size="13" fill="#7C93AE">A full processor built from transistors up, planned and built in stages.</text><text x="40" y="506" font-size="12" fill="#F85804">digital design · CPU</text><rect x="856" y="444" width="120" height="28" rx="14" fill="none" stroke="#F85804" stroke-width="1.5" stroke-dasharray="5 4"/><text x="916.0" y="463" text-anchor="middle" font-size="12.5" fill="#F85804">in progress</text></g></svg>